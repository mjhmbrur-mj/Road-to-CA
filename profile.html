    <style>
        :root { --primary-maroon:#6B0518; --deep-maroon:#4A000E; --pure-white:#FFF; --off-white:#F8F9FA; --text-muted:#6C757D; --border-color:#E0E0E0; }

        .profile-icon { display:grid; place-items:center; width:72px; height:72px; margin:0 auto 1rem; border-radius:50%; background:var(--primary-maroon); color:var(--pure-white); font-size:1.7rem; }
        h1 { margin-bottom:.7rem; font:800 2.2rem 'Montserrat',sans-serif; }

</head>
