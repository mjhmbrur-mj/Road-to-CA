<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="robots" content="noindex, nofollow">
    <title>Private Feedback Inbox | Road to CA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="nav.css">
    <style>
        :root { --primary-maroon:#6B0518; --deep-maroon:#4A000E; --pure-white:#FFF; --off-white:#F8F9FA; --text-dark:#1F1F1F; --text-muted:#6C757D; --border-color:#E0E0E0; --pill-bg:rgba(107,5,24,.08); }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--off-white); color:var(--text-dark); font-family:'Inter',sans-serif; line-height:1.6; }
        .inbox-header { padding:2rem; background:var(--pure-white); border-bottom:1px solid var(--border-color); }
        .inbox-header-inner,.inbox-main { width:min(900px,100% - 2rem); margin:auto; }
        .inbox-header-inner { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
        .inbox-header h1 { margin:0; color:var(--deep-maroon); font:800 clamp(1.4rem,4vw,2rem)/1.2 'Montserrat',sans-serif; }
        .inbox-header p { margin:.4rem 0 0; color:var(--text-muted); font-size:.9rem; }
        .inbox-back { color:var(--primary-maroon); font-weight:700; text-decoration:none; white-space:nowrap; }
        .inbox-back:hover { text-decoration:underline; }
        .inbox-main { padding:2rem 0 5rem; }
        .inbox-toolbar { display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:.75rem; margin:1.25rem 0; }
        .inbox-control { min-width:0; padding:.75rem .85rem; border:1px solid var(--border-color); border-radius:8px; background:var(--pure-white); color:var(--text-dark); font:500 .9rem 'Inter',sans-serif; }
        .inbox-control:focus { border-color:var(--primary-maroon); outline:3px solid var(--pill-bg); }
        .inbox-status-message { margin:1rem 0; padding:.85rem 1rem; border-radius:8px; background:#E8F5E9; color:#1B5E20; font-size:.88rem; }
        .inbox-status-message.is-error { background:#FDECEC; color:#8A1C1C; }
        .inbox-status-message[hidden] { display:none; }
        .inbox-auth-button,.inbox-sign-out,.inbox-review-button { min-height:2.65rem; padding:.65rem .9rem; border:1px solid var(--primary-maroon); border-radius:7px; background:var(--primary-maroon); color:var(--pure-white); font:700 .84rem 'Inter',sans-serif; cursor:pointer; }
        .inbox-auth-button:hover,.inbox-sign-out:hover,.inbox-review-button:hover { background:var(--deep-maroon); }
        .inbox-auth-button:disabled,.inbox-review-button:disabled { opacity:.65; cursor:wait; }
        .inbox-sign-out { border-color:var(--border-color); background:var(--pure-white); color:var(--deep-maroon); }
        .inbox-count { margin:1rem 0; color:var(--text-muted); font-size:.85rem; }
        .inbox-list { display:grid; gap:1rem; }
        .inbox-card { padding:1.2rem; border:1px solid var(--border-color); border-left:4px solid var(--primary-maroon); border-radius:10px; background:var(--pure-white); box-shadow:0 3px 12px rgba(31,31,31,.04); }
        .inbox-card-header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
        .inbox-category-label { color:var(--deep-maroon); font-weight:800; }
        .inbox-status { padding:.22rem .55rem; border-radius:999px; background:var(--pill-bg); color:var(--primary-maroon); font-size:.7rem; font-weight:800; }
        .inbox-status.is-reviewed { background:#E8F5E9; color:#1B5E20; }
        .inbox-message { margin:.85rem 0; overflow-wrap:anywhere; white-space:pre-wrap; }
        .inbox-meta,.inbox-page-link { color:var(--text-muted); font-size:.78rem; overflow-wrap:anywhere; }
        .inbox-page-link { display:inline-block; margin:.15rem 0 .8rem; color:var(--primary-maroon); }
        .inbox-review-button { display:block; min-height:2.3rem; margin-left:auto; padding:.5rem .7rem; font-size:.76rem; }
        .inbox-empty { padding:2rem 1rem; border:1px dashed var(--border-color); border-radius:10px; color:var(--text-muted); text-align:center; }
        @media(max-width:600px) { .inbox-header { padding:1.25rem 0; }.inbox-header-inner { align-items:flex-start; flex-direction:column; }.inbox-toolbar { grid-template-columns:1fr; }.inbox-sign-out { width:100%; } }
    </style>
</head>
<body>
    <header class="inbox-header">
        <div class="inbox-header-inner">
            <div><h1>Private Feedback Inbox</h1><p>Review suggestions and problem reports from Road to CA users.</p></div>
            <a class="inbox-back" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to site</a>
        </div>
    </header>
    <main class="inbox-main">
        <button class="inbox-auth-button" id="inbox-sign-in" type="button"><i class="fa-brands fa-google" aria-hidden="true"></i> Sign in with Google to view feedback</button>
        <button class="inbox-sign-out" id="inbox-sign-out" type="button" hidden>Sign out</button>
        <p class="inbox-status-message" id="inbox-status" role="status" aria-live="polite" hidden></p>
        <section id="inbox-content" aria-label="Feedback messages" hidden>
            <div class="inbox-toolbar">
                <input class="inbox-control" id="inbox-search" type="search" placeholder="Search messages or submitter" aria-label="Search feedback">
                <select class="inbox-control" id="inbox-category" aria-label="Filter feedback category">
                    <option value="all">All feedback types</option>
                    <option>Report a problem</option>
                    <option>Suggest an improvement</option>
                    <option>Ask a question</option>
                    <option>Other feedback</option>
                </select>
            </div>
            <p class="inbox-count" id="inbox-count" aria-live="polite"></p>
            <div class="inbox-list" id="inbox-list"></div>
        </section>
    </main>
    <script type="module" src="js/feedback-inbox.js"></script>
</body>
</html>
